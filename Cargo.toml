[package]
name = "glance"
version = "0.1.0"
edition = "2021"
description = "A fast, simple image viewer for Windows and Linux"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff", "rayon"] }
resvg = "0.50"
kamadak-exif = "0.6"
rfd = "0.18"
arboard = "3.7"
trash = "5.4"
natord = "1.0"
open = "5.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
